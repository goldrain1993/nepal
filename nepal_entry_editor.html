/* v2.0 — Rebuild the ACTUAL EntryJS BlockMenu category data.

const nepalBlockMenuLog=[];
function reportNepalBlockMenu(E){
  let menu=[];

  const ids=nepalReporterDefs.map(item=>item[0]);
  const definitions=ids.filter(id=>Boolean(E?.block?.[id]));
  const menuIds=ids.filter(id=>Boolean(cat?.blocks?.includes(id)));
  const actual=E?.playground?.blockMenu;
  const cachedCat=Array.isArray(actual?._categoryData)?actual._categoryData.find(c=>c.category==='variable'):null;
  const categoryIds=ids.filter(id=>Boolean(cachedCat?.blocks?.includes(id)));
  const threadIds=ids.filter(id=>{
    try {return Boolean(actual?.getThreadByBlockKey?.(id))}
    catch (err){nepalBlockMenuLog.push('스레드 검사 '+id+': '+String(err));return false}
  });
  const svg=document.querySelector('#entryWorkspaceBlockMenu');
  const text=svg?.textContent||'';
  const visualLabels=nepalReporterDefs.filter(([,label])=>text.includes(label)).map(([id])=>id);
  return {
    definitions,menuIds,categoryIds,threadIds,visualLabels,expected:ids,categoryFound:!!cat,
    setCategoryData:typeof actual?.setCategoryData,
    addCategoryData:typeof actual?.addCategoryData,
    selectMenu:typeof actual?.selectMenu,
    setBlockMenu:typeof E?.playground?.setBlockMenu,

    editorReady:!!window.__entryReady
  };
}

function getVar(name){return window.Entry?.variableContainer?.getVariableByName(name,false)}
function getList(name){return window.Entry?.variableContainer?.getListByName(name,false)}
function readVar(name){const v=getVar(name);if(!v)return null;try{return v.getValue()}catch(e){return v.value_}}
function setVar(name,value){const v=getVar(name);if(!v)throw new Error('학생이 만든 변수 '+name+'가 없습니다.');v.setValue(value)}
function readList(name){const l=getList(name);if(!l)return null;return l.getArray().map(v=>v && typeof v==='object' && 'data' in v?v.data:v)}
function clearList(name){const l=getList(name);if(!l)throw new Error('학생이 만든 리스트 '+name+'가 없습니다.');l.getArray().splice(0)}
function saveProject(){return window.Entry.exportProject()}
function codeHasTypes(types){const p=saveProject();const scripts=JSON.stringify((p.objects||[]).map(o=>o.script||''));return types.every(t=>scripts.includes('"'+t+'"')||scripts.includes(t))}
function numericMatches(actual,expected){return actual!=='' && actual!==null && actual!==undefined && Number.isFinite(Number(actual)) && Math.abs(Number(actual)-expected)<1e-5}
function resetTestReadings(){for(const key of Object.keys(nepalTestValues))nepalTestValues[key]=null}
async function stopCode(){
  const engine=window.Entry?.engine;
  if(!engine)return;
  // IMPORTANT: engine.stop() stops EntryJS's timer without transitioning to
  // the stopped state. Subsequent toggleRun calls do not fire start scripts.
  if(engine.state!=='stop' && typeof engine.toggleStop==='function'){
    await engine.toggleStop();
    for(let n=0;n<20 && engine.state!=='stop';n++)await wait(50);
  }
}
async function startCode(){
  const engine=window.Entry?.engine;
  if(!engine || typeof engine.toggleRun!=='function')throw Error('엔트리 실행 엔진을 찾을 수 없습니다.');
  await stopCode();
  engine.toggleRun();
  if(engine.state!=='run')throw Error('엔트리가 실행 상태로 전환되지 않았습니다.');
}
async function waitForValues(checker,timeout=2500){
  const started=Date.now();
  do{
    if(checker())return true;
    await wait(70);
  }while(Date.now()-started<timeout);
  return checker();
}
/* Mission 02. Deliberately keep ONE engine run and change the
 * internal READ-ONLY sensor register three times. A one-shot assignment,
 * constant, and fake block appearances cannot pass all three probes.
 * The reporter remains a normal oval field in the DATA category.
 */
async function checkRealtimeLoopMission(){
  if(!window.__entryReady)throw Error('엔트리 편집기 준비가 아직 끝나지 않았습니다.');
  if(!getVar('수위센서값'))return {ok:false,details:['먼저 미션 01에서 「수위센서값」 변수를 만드세요.']};
  if(!codeHasTypes(['repeat_inf','set_variable','nepal_live_water_sensor'])){
    return {ok:false,details:['「계속 반복하기」 안에 「수위센서값을 (수위 센서가 현재 측정하고 있는 실시간 값)으로 정하기」 블록을 넣으세요.','실시간 값이 바뀌면 학생 변수도 바뀌어야 합니다.']};
  }
  const samples=[4.2,6.8,1.35];
  const details=[];
  let allPassed=true;
  try{
    await stopCode();
    setVar('수위센서값','');
    nepalTestValues.water=samples[0];
    await startCode();
    // Do not restart the program between values; this is the core distinction.
    for(const sample of samples){
      nepalTestValues.water=sample;
      const passed=await waitForValues(()=>numericMatches(readVar('수위센서값'),sample),2700);
      const actual=readVar('수위센서값');
      allPassed=allPassed&&passed;
      details.push(`작동 중 측정값 ${sample}m → 저장값 ${numericMatches(actual,sample)?sample+'m ✓':actual===''?'미저장 ✗':String(actual)+'m ✗'}`);
      if(!passed)break;
    }
    details.push(allPassed
      ?'재시작 없이 측정값이 바뀔 때마다 학생 변수가 갱신됐습니다. 반복문의 반복 실행이 확인됐습니다.'
      :'실행을 재시작하지 않았을 때도 계속 변해야 합니다. 반복문 안에 저장 블록이 들어 있는지 확인하세요.');
  }finally{
    await stopCode();
    resetTestReadings();
  }
  if(allPassed){
    try{
      await startCode();
      await waitForValues(()=>numericMatches(readVar('수위센서값'),nepalSensorValue('water')),2000);
      details.push('학생이 직접 작성한 반복문이 센서값의 변화를 계속 기록하고 있습니다.');
    }catch(e){details.push('실습 재실행 안내: '+String(e.message||e));}
  }
  return {ok:allPassed,details};
}

/* 미션 03 — 한 번 시작한 엔트리 프로그램에서 3개 센서값을 계속 갱신하는지 검사.

async function checkLiveSensorListMission(){
  if(!window.__entryReady)throw Error('엔트리 편집기 준비가 아직 끝나지 않았습니다.');
  const names=['수위센서값','유속센서값','진동센서값'];
  for(const name of names){
    if(!getVar(name))return {ok:false,details:[`「${name}」 변수를 직접 만드세요.`]};
  }
  if(!getList('센서값목록'))return {ok:false,details:['「센서값목록」 리스트를 직접 만드세요.']};
  if(!codeHasTypes(['repeat_inf','set_variable','change_value_list_index',
    ...nepalReporterDefs.map(d=>d[0])])){
    return {ok:false,details:[
      '실시간 센서 블록 3개로 각 변수의 값을 저장해야 합니다.',
      '「자료」 탭에서 리스트의 정해진 위치의 값을 바꾸는 블록을 찾아 보세요.',
      '반복 실행 도중 센서값이 변해도 목록의 항목은 3개로 유지되어야 합니다.'
    ]};
  }
  const samples=[
    {water:4.2,flow:3.1,vibration:2.8},
    {water:6.8,flow:4.35,vibration:1.9},
    {water:2.15,flow:5.6,vibration:4.4}
  ];
  const details=[];
  let allPassed=true;
  try{
    await stopCode();
    Object.assign(nepalTestValues,samples[0]);
    for(const name of names)setVar(name,'');
    // 학생의 초기 리스트는 보존: 직접 항목 3개를 준비했는지,
    // 혹은 시작 코드를 이용해 한 번만 3개를 추가했는지 모두 허용한다.
    // test에서 clearList()를 쓰면 사용자가 만든 초기 항목까지 삭제된다.
    await startCode();
    for(let i=0;i<samples.length;i++){
      const sample=samples[i];
      Object.assign(nepalTestValues,sample);
      const expected=[sample.water,sample.flow,sample.vibration];
      const valid=()=>{
        const saved=names.map(readVar);
        const list=readList('센서값목록')||[];
        return list.length===3 &&
          expected.every((v,j)=>numericMatches(saved[j],v) && numericMatches(list[j],v));
      };
      const passed=await waitForValues(valid,3200);
      const saved=names.map(readVar);
      const list=readList('센서값목록')||[];
      details.push(`${i+1}차 측정 [${expected.join(', ')}] → 변수 [${saved.map(v=>v===''?'미저장':v).join(', ')}] · 리스트 [${list.join(', ')}] (${list.length}개) ${passed?'✓':'✗'}`);
      if(!passed){allPassed=false;break;}
    }
    details.push(allPassed
      ?'프로그램을 재시작하지 않고도 현재 센서값 3개가 목록의 같은 자리에 갱신됐습니다!'
      :'센서 측정값이 변한 뒤에도 세 변수와 리스트 1·2·3번 값이 모두 바뀌는지 확인하세요. 목록에 값을 계속 추가하면 길이가 3개를 초과해 실패합니다.');
  }finally{
    await stopCode();
    resetTestReadings();
  }
  if(allPassed){
    try{
      await startCode();
      await waitForValues(()=>{
        const list=readList('센서값목록')||[];
        return list.length===3 && list.every((v,i)=>numericMatches(v,
          [nepalSensorValue('water'),nepalSensorValue('flow'),nepalSensorValue('vibration')][i]));
      },2200);
      details.push('실습용 실시간 센서와 학생의 엔트리 코드를 다시 연결했습니다. 수정할 때는 엔트리 ■ 정지를 누르세요.');
    }catch(err){details.push('실습 재실행 안내: '+String(err.message||err));}
  }
  return {ok:allPassed,details};
}

  function parseAsset(uri) {
    if (!uri || /^(data:|blob:|javascript:|#)/i.test(uri)) return null;
    let url;try {url=new URL(uri,location.href)}catch(_){return null}

const NEPAL_SPRITES = [
 {key:'sensor',label:'센서 관측기'},
 {key:'alarm',label:'경보 장치'},
 {key:'village',label:'대피 마을'},
 {key:'robot',label:'관측 로봇'}
];
let nepalSpriteMode = 'object';
const nepalChooser=document.getElementById('nepalSpriteChooser');
const nepalMsg=document.getElementById('nepalSpriteMessage');
function nepalObjectPicture(name, uri, dims={width:192,height:192}) {
  // EntryJS's Picture schema accepts a concrete fileurl; filename alone would use
  // /uploads at the publisher's web root, inaccessible at /nepal/.
  return {
    id:Entry.generateHash(12), name, label:{ko:name,en:name},
    imageType: uri.startsWith('data:image/jpeg')?'jpg':'png', fileurl:uri,
    dimension:{width:dims.width,height:dims.height}, trimmed:null
  };
}
function nepalAddSprite(name,uri,dims){
 const picture=nepalObjectPicture(name,uri,dims);
 if(nepalSpriteMode==='picture' && typeof Entry.playground?.addPicture==='function'){
   Entry.playground.addPicture(picture,true,true);
 }else{
   if(typeof Entry.container?.addObject!=='function')throw Error('Entry.container.addObject를 찾지 못했습니다.');
   Entry.container.addObject({id:Entry.generateHash(12),name,objectType:'sprite',sprite:{name,pictures:[picture],sounds:[],category:{}}},0);
 }
}
function nepalOpenChooser(mode='object'){
 nepalSpriteMode=mode;
 document.getElementById('nepalSpriteTitle').textContent=mode==='picture'?'모양 추가하기':'오브젝트 추가하기';
 nepalMsg.textContent='';nepalChooser.hidden=false;
 document.getElementById('nepalSpriteClose').focus();
}
function nepalCloseChooser(){nepalChooser.hidden=true;}
function nepalWireObjectEvents(E){
 if(typeof E.addEventListener!=='function'){
   console.warn('[NEPAL] Entry.addEventListener is missing');return;
 }
 E.addEventListener('openSpriteManager',()=>nepalOpenChooser('object'));
 E.addEventListener('openPictureManager',()=>nepalOpenChooser('picture'));
 // The original EntryJS workspace also broadcasts other manager events;
 // we do not impersonate the official cloud catalog. They are outside this lesson.
}
function nepalRepairStarter(E){
 // EntryJS start-project's default EntryBot often points to unreachable /uploads.
 // Give the existing default object a self-contained picture when supported.
 if(Array.isArray(E.container?.objects_) && E.container.objects_.length>0 && typeof E.playground?.addPicture==='function'){
   try{E.playground.addPicture(nepalObjectPicture('관측 로봇',NEPAL_SPRITE_IMAGE.robot),true,true)}
   catch(err){console.warn('[NEPAL] 기본 오브젝트 모양 추가 생략:',err)}
 }
 // Add a real mission sprite through the public Entry.container.addObject API.
 // This remains visible even if the starter EntryBot has a broken asset filename.
 try{nepalAddSprite('센서 관측기',NEPAL_SPRITE_IMAGE.sensor)}
 catch(err){console.warn('[NEPAL] 센서 관측기 추가 실패:',err)}
}
function nepalInitPicker(){
 const grid=document.getElementById('nepalSpriteGrid');
 for(const item of NEPAL_SPRITES){
  const button=document.createElement('button');button.type='button';button.className='npsprite';
  const img=document.createElement('img');img.src=NEPAL_SPRITE_IMAGE[item.key];img.alt='';
  const label=document.createElement('span');label.textContent=item.label;
  button.append(img,label);button.addEventListener('click',()=>{
    try{nepalAddSprite(item.label,NEPAL_SPRITE_IMAGE[item.key]);nepalCloseChooser()}
    catch(err){nepalMsg.textContent='오브젝트 추가 실패: '+String(err?.message||err);console.error(err)}
  });grid.appendChild(button);
 }
 document.getElementById('nepalSpriteClose').addEventListener('click',nepalCloseChooser);
 nepalChooser.addEventListener('click',e=>{if(e.target===nepalChooser)nepalCloseChooser()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!nepalChooser.hidden)nepalCloseChooser()});
 document.getElementById('nepalImageUpload').addEventListener('change',async e=>{
  const file=e.target.files?.[0];if(!file)return;
  if(!['image/png','image/jpeg','image/webp'].includes(file.type)){nepalMsg.textContent='PNG, JPG 또는 WEBP 이미지 파일을 선택하세요.';return;}
  if(file.size>3*1024*1024){nepalMsg.textContent='이미지 크기는 3MB 이하여야 합니다.';return;}
  try{
    const uri=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('파일을 읽을 수 없습니다.'));reader.readAsDataURL(file)});
    const dims=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve({width:img.naturalWidth,height:img.naturalHeight});img.onerror=()=>reject(Error('이미지를 열 수 없습니다.'));img.src=uri});
    nepalAddSprite(file.name.replace(/\.[^.]+$/,''),uri,dims);nepalCloseChooser();
  }catch(err){nepalMsg.textContent='이미지 추가 실패: '+err.message}finally{e.target.value=''}
 });
}
nepalInitPicker();

async function boot(){try{
  for(let i=0;i<deps.length;i++){await loadDependency(deps[i][0],deps[i][1],deps[i][2],i+1,deps.length);}
  if(typeof window.Entry?.init!=='function')throw Error('EntryJS 로딩 후 초기화 함수를 찾지 못했습니다.');
  const E=window.Entry;
  installNepalSensorReporters(E);
  statusEl.textContent='엔트리 실행 환경을 초기화하는 중…';
  if(E.Event)E.creationChangedEvent=new E.Event(window);
  E.init(document.getElementById('workspace'),{
    type:'workspace',libDir:'https://entry-cdn.pstatic.net/lib',entryDir:'/entry-js',defaultDir:'https://playentry.org',soundDir:'https://playentry.org',
    projectsaveable:true,variableEnable:true,listEnable:true,
    hardwareEnable:false,textCodingEnable:false,expansionDisable:true,
    fonts:[{name:'나눔고딕',family:'Nanum Gothic',url:'https://fonts.googleapis.com/earlyaccess/nanumgothic.css'}]
  });
  nepalWireObjectEvents(E);
  try{window.createjs?.Sound?.setMute?.(true)}catch(_){}
  await Promise.resolve(E.loadProject());await wait(750);
  nepalRepairStarter(E);
  removeOldTeacherSeeds(E);
  // Refresh the EntryJS toolbox AFTER loadProject and starter objects have been prepared.
  // The v1.3 version registered the reporters too early; they were absent from '자료'.
  let blockMenuStatus;
  try{blockMenuStatus=refreshNepalBlockMenu(E,'프로젝트 로드 후');}
  catch(menuError){nepalBlockMenuLog.push('자동 메뉴 등록 오류: '+String(menuError));console.error('[NEPAL] 센서 블록 메뉴',menuError)}
  // Do NOT pre-create any student variable: creating all three is the learning task.
  window.__entryReady=true;
  // EntryJS generates category codes asynchronously. Show successful status
  // only if all three sensor labels actually appear in the SVG.
  function verifyReporterRender(){
    const shown=updateNepalBlockStatus(E).visualLabels.length;
    statusEl.textContent=shown===3
      ? '✅ 엔트리 준비 완료 · 자료 탭 센서 블록 3종 표시'
      : `⚠ 엔트리 준비 완료 · 센서 블록 화면 표시 ${shown}/3`;
  }
  [200,650,1300].forEach(ms=>setTimeout(verifyReporterRender,ms));
  notify('ENTRY_READY');
 }catch(e){console.error('[NEPAL ENTRY v2.2] 부팅 실패',e,executionErrors,bootNotes);fail(e.message||String(e));}}
window.addEventListener('message',e=>{
  if(e.source!==window.parent || e.origin!==location.origin)return;
  if(e.data?.type!=='NEPAL_SENSOR_TELEMETRY')return;
  const sensor=e.data.sensor;
  if(!Object.prototype.hasOwnProperty.call(nepalPrivateTelemetry,sensor))return;
  const v=Number(e.data.value);
  if(Number.isFinite(v) && v>=0 && v<100000){
    // Not stored in Entry.variableContainer: no variable dropdown access.
    nepalPrivateTelemetry[sensor]={value:v,source:String(e.data.source||'센서 측정값')};
    if(sensor==='water'){
      const el=document.getElementById('nepal-sensor-preview');
      if(el)el.textContent='📡 수위 '+v.toFixed(2)+' m · 읽기 전용';
    }
  }
});
// The parent overlay is the source of truth for active/hidden developer state.
// Never keep an EntryJS infinite-repeat script running behind the simulator.
window.addEventListener('message',e=>{
  if(e.source!==window.parent || e.origin!==location.origin)return;
  if(e.data?.type==='NEPAL_DEV_RESUME'){
    nepalDeveloperVisible=true;
  }else if(e.data?.type==='NEPAL_DEV_PAUSE'){
    nepalDeveloperVisible=false;
    if(window.__entryReady && !nepalChecking){
      Promise.resolve(stopCode()).catch(error=>console.warn('엔트리 일시정지:',error));
    }
  }
});
// Read-only comparison of the student variable and the privately measured value.
let nepalDeveloperVisible=false;
setInterval(()=>{
 if(!window.__entryReady || !nepalDeveloperVisible || nepalChecking)return;
 const actual=readVar('수위센서값');
 notify('ENTRY_VAR_SNAPSHOT',{
   value:actual===null||actual===''?null:Number(actual),
   variables:{water:readVar('수위센서값'),flow:readVar('유속센서값'),vibration:readVar('진동센서값')},
   list:readList('센서값목록'),
   running:nepalIsRunning()
 });
},700);
window.addEventListener('message',async e=>{
 if(e.source!==window.parent || e.origin!==location.origin)return;
 if(e.data?.type!=='NEPAL_TEST')return;
 if(nepalChecking){notify('ENTRY_CHECK_RESULT',{ok:false,details:['이미 검사가 실행 중입니다. 잠시 기다려 주세요.']});return;}
 nepalChecking=true;
 try{const result=await check(Number(e.data.mission));notify('ENTRY_CHECK_RESULT',result)}
 catch(error){notify('ENTRY_CHECK_RESULT',{ok:false,details:['엔트리 실행 또는 검사 오류: '+String(error.message||error),'브라우저 개발자 도구 콘솔을 확인해 주세요.']})}
 finally{
  nepalChecking=false;
  if(!nepalDeveloperVisible && window.__entryReady){
    try{await stopCode()}catch(err){console.warn('숨김 상태 엔트리 정지',err)}
  }
 }
});
document.getElementById('assets-status').addEventListener('click',()=>{document.getElementById('assets-report-text').textContent=NEPAL_ASSET_RESCUE.diagnostic();document.getElementById('assets-report').style.display='block';});
document.getElementById('assets-status').addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click();}});
document.getElementById('close-assets').addEventListener('click',()=>{document.getElementById('assets-report').style.display='none'});
document.getElementById('copy-assets').addEventListener('click',()=>{navigator.clipboard.writeText(NEPAL_ASSET_RESCUE.diagnostic()).then(()=>{document.getElementById('copy-assets').textContent='복사 완료'})});
NEPAL_ASSET_RESCUE.install();
boot();
</script></body></html>
