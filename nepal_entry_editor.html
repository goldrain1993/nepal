function installNepalSensorReporters(E){
  if(!window.EntryStatic || typeof EntryStatic.getAllBlocks!=='function'){
    throw Error('EntryStatic 블록 메뉴를 찾을 수 없습니다.');
  }
  if(!E.block)E.block={};
  for(const [id,label,sensor] of [...nepalReporterDefs,...nepalLegacyReporterDefs]){
    // Keep EntryJS localization fallback in sync with the explicit schema template.
    if(window.Lang && Lang.template)Lang.template[id]='%1';
    E.block[id]={
      color:EntryStatic.colorSet?.block?.default?.VARIABLE || '#C25B9A',
      outerLine:EntryStatic.colorSet?.block?.darken?.VARIABLE || '#9D467D',
      skeleton:'basic_string_field',
      // EntryJS BlockView._getTemplate() requires template or Lang.template[id].
      // Without it the SVG oval renders with NO text (seen as three purple dots).
      template:'%1',
      statements:[],
      params:[{type:'Text',text:label,color:'#ffffff'}],
      events:{},
      def:{params:[null],type:id},
      class:'variable',isNotFor:[],
      func:function(sprite,script){return id.startsWith('nepal_limit_')?legacyRuleValue():nepalSensorValue(sensor)},
      syntax:{js:[],py:[{water:'nepal_water_sensor()',flow:'nepal_flow_sensor()',vibration:'nepal_vibration_sensor()',rain:'nepal_rain_sensor()'}[sensor]]}
    };
  }
  // Extend the built-in EntryJS '자료' (variable) category.
  const original=EntryStatic.getAllBlocks;
  if(!original.__nepalSensorWrapped){
    const wrapped=function(...args){
      const menus=original.apply(this,args);
      if(Array.isArray(menus)){
        const cat=menus.find(m=>m.category==='variable');
        if(cat && Array.isArray(cat.blocks)){
          let insertAt=cat.blocks.indexOf('listAddButton')+1;
          for(const [id] of nepalReporterDefs){
            if(!cat.blocks.includes(id))cat.blocks.splice(insertAt++,0,id);
          }
        }
      }
      return menus;
    };
    wrapped.__nepalSensorWrapped=true;
    EntryStatic.getAllBlocks=wrapped;
  }
  if(Array.isArray(EntryStatic.variableBlockList)){
    for(const [id] of nepalReporterDefs){
      if(!EntryStatic.variableBlockList.includes(id))EntryStatic.variableBlockList.push(id);
    }
  }
}
/* v2.0 — Rebuild the ACTUAL EntryJS BlockMenu category data.
 * EntryStatic.getAllBlocks() is only a blueprint; changing that blueprint does
 * NOT rebuild an already-constructed Entry.BlockMenu. Previous v1.4 reported
 * 3/3 registered even when the menu contained zero usable rendered threads.
 * EntryJS src/playground/block_menu.ts provides setCategoryData(), which clears
 * category views, builds block threads, and redraws the menu. Prefer that API.
 */
const nepalBlockMenuLog=[];
function reportNepalBlockMenu(E){
  let menu=[];
  try{menu=EntryStatic.getAllBlocks()}catch(err){nepalBlockMenuLog.push('getAllBlocks 예외: '+String(err))}
  const cat=Array.isArray(menu)?menu.find(item=>item.category==='variable'):null;
  const ids=nepalReporterDefs.map(item=>item[0]);
  const definitions=ids.filter(id=>Boolean(E?.block?.[id]));
  const menuIds=ids.filter(id=>Boolean(cat?.blocks?.includes(id)));
  const actual=E?.playground?.blockMenu;
  const cachedCat=Array.isArray(actual?._categoryData)?actual._categoryData.find(c=>c.category==='variable'):null;
  const categoryIds=ids.filter(id=>Boolean(cachedCat?.blocks?.includes(id)));
  const threadIds=ids.filter(id=>{
    try {return Boolean(actual?.getThreadByBlockKey?.(id))}
    catch (err){nepalBlockMenuLog.push('스레드 검사 '+id+': '+String(err));return false}
  });
  const svg=document.querySelector('#entryWorkspaceBlockMenu');
  const text=svg?.textContent||'';
  const visualLabels=nepalReporterDefs.filter(([,label])=>text.includes(label)).map(([id])=>id);
  return {
    definitions,menuIds,categoryIds,threadIds,visualLabels,expected:ids,categoryFound:!!cat,
    setCategoryData:typeof actual?.setCategoryData,
    addCategoryData:typeof actual?.addCategoryData,
    selectMenu:typeof actual?.selectMenu,
    setBlockMenu:typeof E?.playground?.setBlockMenu,
    activeMenu:actual?.lastSelector||'(알 수 없음)',
    editorReady:!!window.__entryReady
  };
}
function updateNepalBlockStatus(E){
  const info=reportNepalBlockMenu(E);
  // Never label it 3/3 merely because the blueprint mentions three block IDs.
  // A thread may exist but render as an empty oval. Count visible SVG labels.
  const count=info.visualLabels.length;
  const total=nepalReporterDefs.length;
  document.getElementById('nepal-block-inspector').textContent=
    count===total ? `🧩 센서 블록 표시 ${total}/${total}` : `⚠ 센서 블록 표시 ${count}/${total}`;
  return info;
}
function refreshNepalBlockMenu(E,source='manual'){
  installNepalSensorReporters(E);
  const info=reportNepalBlockMenu(E);
  if(info.definitions.length!==nepalReporterDefs.length || info.menuIds.length!==nepalReporterDefs.length){
    throw new Error('센서 블록 정의/목록 누락: '+JSON.stringify(info));
  }
  const pg=E?.playground;
  const bm=pg?.blockMenu;
  if(!bm){throw Error('Entry.playground.blockMenu를 찾지 못했습니다. 오브젝트 선택 후 다시 시도하세요.');}
  const catalog=EntryStatic.getAllBlocks().map(item=>({...item, blocks:[...(item.blocks||[])]}));
  if(typeof bm.setCategoryData==='function'){
    // This actually creates Entry BlockMenu threads and SVG category views.
    bm.setCategoryData(catalog);
    nepalBlockMenuLog.push(source+': blockMenu.setCategoryData() 완료');
  }else if(typeof bm.addCategoryData==='function'){
    for(const [id] of nepalReporterDefs)bm.addCategoryData('variable',id);
    bm.setMenu?.();
    nepalBlockMenuLog.push(source+': blockMenu.addCategoryData() 3종 호출');
  }else if(typeof pg?.setBlockMenu==='function'){
    pg.setBlockMenu();
    nepalBlockMenuLog.push(source+': 구버전 playground.setBlockMenu() 사용');
  }else{
    throw Error('엔트리 블록 메뉴 재생성 API가 없습니다.');
  }
  // Reopen the DATA category. Updating catalog alone leaves the old selection
  // rendering cached, which is the reason the screenshot still showed old items.
  if(typeof bm.selectMenu==='function')bm.selectMenu('variable',true);
  const actual=updateNepalBlockStatus(E);
  if(actual.threadIds.length!==nepalReporterDefs.length){
    nepalBlockMenuLog.push(source+': 생성된 블록 스레드 '+actual.threadIds.length+'/'+nepalReporterDefs.length);
    console.warn('[NEPAL] 센서 블록 실제 스레드 누락', actual);
  }
  return actual;
}

async function stopCode(){
  const engine=window.Entry?.engine;
  if(!engine)return;
  // IMPORTANT: engine.stop() stops EntryJS's timer without transitioning to
  // the stopped state. Subsequent toggleRun calls do not fire start scripts.
  if(engine.state!=='stop' && typeof engine.toggleStop==='function'){
    await engine.toggleStop();
    for(let n=0;n<20 && engine.state!=='stop';n++)await wait(50);
  }
}
async function startCode(){
  const engine=window.Entry?.engine;
  if(!engine || typeof engine.toggleRun!=='function')throw Error('엔트리 실행 엔진을 찾을 수 없습니다.');
  await stopCode();
  engine.toggleRun();
  if(engine.state!=='run')throw Error('엔트리가 실행 상태로 전환되지 않았습니다.');
}
async function waitForValues(checker,timeout=2500){
  const started=Date.now();
  do{
    if(checker())return true;
    await wait(70);
  }while(Date.now()-started<timeout);
  return checker();
}

/* Mission 02 — check BOTH the EntryJS block structure and live behaviour.
 * Restarting for every test case falsely accepted a one-shot condition. We run
 * the student project ONCE, switch sensor readings repeatedly and require the
 * student program to update the risk variable in the SAME running session.
 * Both two separate "if" blocks (_if) and one "if/else" block are valid.
 */
/* Missions 02~06: readings must be assigned repeatedly, not as a one-off
 * instruction before/after a forever-loop. Inspect the ACTUAL EntryJS script
 * trees, and verify changing readings while the engine stays running. */
function liveSensorsAssignedInsideForever(sensorKeys){
 const obj=saveProject();
 const reporters={water:'nepal_live_water_sensor',flow:'nepal_live_flow_sensor',
   vibration:'nepal_live_vibration_sensor',rain:'nepal_live_rain_sensor'};
 function normalise(node){if(typeof node==='string'){try{return JSON.parse(node)}catch(_){return null}}return node}
 function find(node,predicate){
   node=normalise(node);
   if(!node||typeof node!=='object')return false;
   if(Array.isArray(node))return node.some(n=>find(n,predicate));
   if(predicate(node))return true;
   return Object.values(node).some(n=>find(n,predicate));
 }
 const scripts=(obj.objects||[]).map(o=>normalise(o.script));
 return sensorKeys.every(key=>scripts.some(script=>find(script,node=>{
   if(node.type!=='repeat_inf'||!node.statements)return false;
   // Reject a sensor reporter or variable assignment floating outside the loop.
   return find(node.statements,n=>n.type==='set_variable' &&
      find(n.params||[],param=>param.type===reporters[key]));
 })));
}
function realTimeSensorHint(keys){
 const map={water:'수위값',flow:'유속값',vibration:'진동값',rain:'강수값'};
 return `「계속 반복하기」 안에서 ${keys.map(k=>'「'+map[k]+'」').join('·')}에 실시간 센서값을 다시 저장하도록 배치해 주세요. 반복문 밖에서 한 번 저장하는 것으로는 통과할 수 없습니다.`;
}

     if(!passed){ok=false;details.push('센서값이 변해도 다시 측정하고 위험을 판단하도록 전체 센서 읽기/조건문을 반복문 안에 넣어 보세요.');break}

function mission2HasConditionalInsideForeverLoop(){
 const data=saveProject();
 function normalise(node){
  if(typeof node==='string'){
   try{return JSON.parse(node)}catch(_){return null}
  }
  return node;
 }
 function hasIf(node){
  node=normalise(node);
  if(!node||typeof node!=='object')return false;
  if(Array.isArray(node))return node.some(hasIf);
  if(node.type==='_if'||node.type==='if_else')return true;
  return Object.values(node).some(hasIf);
 }
 function walk(node){
  node=normalise(node);
  if(!node||typeof node!=='object')return false;
  if(Array.isArray(node))return node.some(walk);
  // EntryJS stores a loop's enclosed blocks in .statements. Blocks appearing
  // immediately BEFORE or AFTER the loop do NOT qualify.
  if(node.type==='repeat_inf' && hasIf(node.statements))return true;
  return Object.values(node).some(walk);
 }
 return (data.objects||[]).some(object=>walk(object.script));
}

   '「만일」 또는 「만일~아니면」 조건문을 「계속 반복하기」 블록 안에 넣어 주세요.',
   '반복문 바깥의 조건문은 수위를 한 번만 판단하므로 실시간 경보 시스템의 정답이 아닙니다.'
  ]};
 }
 const samples=[2.35,4.8,3.99,4,5.2,3.1];
 const details=[];
 let allPassed=true;
 try{
  await stopCode();
  setVar('수위값','');
  setVar('수위위험','');
  nepalTestValues.water=samples[0];
  await startCode();
  // Absolutely no restart/stop inside this loop. A one-shot decision must fail.
  for(let i=0;i<samples.length;i++){
   const water=samples[i],expected=Number(water>=NEPAL_THRESHOLDS.water);
   nepalTestValues.water=water;
   const passed=await waitForValues(()=>
     numericMatches(readVar('수위값'),water)&&
     numericMatches(readVar('수위위험'),expected),3200);
   const observedWater=readVar('수위값'),observedRisk=readVar('수위위험');
   details.push(`${i+1}차 수위 ${water.toFixed(2)}m → 기대 위험 ${expected} / 수위값 ${observedWater===''?'미저장':observedWater} · 수위위험 ${observedRisk===''?'미저장':observedRisk} ${passed?'✓':'✗'}`);
   if(!passed){
    allPassed=false;
    details.push('수위가 바뀌어도 실시간 판단이 계속되도록 센서값 갱신과 조건문을 반복문 안에 배치해 보세요.');
    break;
   }
  }
 }finally{
  await stopCode();
  resetTestReadings();
 }
 if(allPassed)details.push('연속 실행 상태에서 안전·위험·경계값을 모두 정확히 판단했습니다! 「만일」과 「만일~아니면」 모두 정답으로 인정합니다.');
 return {ok:allPassed,details};
}

 if(!codeHasTypes(['set_variable','nepal_live_flow_sensor','nepal_live_vibration_sensor','nepal_live_rain_sensor'])||!hasConditionBlocks())return {ok:false,details:['미션 03의 조건문을 응용해 유속·진동·강수를 측정하고 위험 여부를 각각 판정하세요.']};
 if(!liveSensorsAssignedInsideForever(['water','flow','vibration','rain']))
   return {ok:false,details:[realTimeSensorHint(['water','flow','vibration','rain'])]};
 const cases=[

  {water:3.5,flow:3.6,vibration:15,rain:30},
  {water:3.5,flow:2.5,vibration:17.2,rain:30},

  {water:3.5,flow:3,vibration:16,rain:35},

  {water:3.5,flow:3.8,vibration:18.2,rain:45}

 const result=await testContinuousRiskScenarios(cases,v=>({

  '유속위험':Number(v.flow>=NEPAL_THRESHOLDS.flow),
  '진동위험':Number(v.vibration>=NEPAL_THRESHOLDS.vibration),
  '강수위험':Number(v.rain>=NEPAL_THRESHOLDS.rain)

/* Mission 6 now learns LISTS only. The shared sensor-code check below
 * tests list population and counting but does not trigger a 100-run grade.

/* Mission 06: the simulator supplies only sensor positions and data.
 * Infer monotonic per-sensor thresholds directly from the student's running
 * EntryJS code, on the same one continuously running session, using 0.1-grid
 * values (all disaster sensor readings are rounded to one decimal). No
 * threshold/compare operator is read from simulator settings.
 * Then test all 16 risk combinations using the student's own EntryJS logic.
 */
async function checkChosenAlarmN(requireList=false){
 const labels=['수위','유속','진동','강수'];
 const riskVars=labels.map(label=>label+'위험');
 const valueVars=labels.map(label=>label+'값');
 const required=[...valueVars,...riskVars,'위험개수','경보결과',...(requireList?['반복번호']:[])];
 for(const name of required)if(!getVar(name))return {ok:false,details:[`「${name}」 변수가 없습니다. 엔트리 코드에 직접 만들어 주세요.`]};
 if(requireList&&!getList('위험목록'))return {ok:false,details:['이번 미션에서는 「위험목록」 리스트를 만들고 위험신호 4개를 저장해 주세요.']};
 if(!liveSensorsAssignedInsideForever(NEPAL_SENSOR_ORDER))return {ok:false,details:[realTimeSensorHint(NEPAL_SENSOR_ORDER)]};
 if(requireList&&(!codeHasTypes(['value_of_index_from_list','change_variable']) || !codeHasTypes(['repeat_basic'])))
   return {ok:false,details:['리스트의 항목을 반복해서 검사하고 위험개수를 계산하도록 「반복하기」·「리스트 n번째 값」·「변수 더하기」 블록을 사용해 보세요.']};
 const savedScripts=JSON.stringify((saveProject().objects||[]).map(o=>o.script||''));
 if(savedScripts.includes('nepal_limit_'))return {ok:false,details:[
   '예전 「시뮬레이션에서 설정한 위험 기준값」 블록이 남아 있습니다.',
   '해당 블록을 제거하고, 엔트리의 수치·비교 연산 블록으로 4개 센서의 위험 기준을 직접 작성해 주세요.'
 ]};
 const upperTicks={water:120,flow:120,vibration:300,rain:1000};
 const lows=Object.fromEntries(NEPAL_SENSOR_ORDER.map(key=>[key,0]));
 const highs=Object.fromEntries(NEPAL_SENSOR_ORDER.map(key=>[key,upperTicks[key]/10]));
 const details=[];
 // Probe after all four measured variables caught up, then allow the student's
 // condition/list loop to settle before reading risk verdicts.
 async function probe(readings){
   Object.assign(nepalTestValues,readings);
   const ready=await waitForValues(()=>NEPAL_SENSOR_ORDER.every((key,i)=>numericMatches(readVar(valueVars[i]),readings[key])),5000);
   if(!ready)throw Error('실시간 센서값이 반복해서 갱신되지 않습니다. 「계속 반복하기」의 센서값 저장을 확인하세요.');
   await wait(260);
   const values=riskVars.map(name=>Number(readVar(name)));
   if(values.some((val,i)=>readVar(riskVars[i])==='' || !Number.isFinite(val) || (val!==0&&val!==1)))
     throw Error('4개 센서의 위험 여부는 각각 0 또는 1이 되도록 작성해야 합니다.');
   return values;
 }
 let ruleInfo=[];
 let observations=Array(16).fill(null),byCount=Array.from({length:5},()=>new Set());
 try{
   await stopCode();
   Object.assign(nepalTestValues,lows);
   if(requireList){const lst=getList('위험목록');if(lst)lst.getArray().splice(0);}
   for(const name of required)if(getVar(name))setVar(name,'');
   await startCode();
   const a=await probe(lows),b=await probe(highs);
   const state=NEPAL_SENSOR_ORDER.map((key,i)=>{
     if(a[i]===b[i])throw Error(labels[i]+' 센서의 위험 판정이 측정값 변화에 반응하지 않습니다. 센서값과 비교 연산을 확인하세요.');
     return {sensor:key,label:labels[i],op:a[i]===0?'ge':'le',
       lo:0,hi:upperTicks[key],start:a[i],end:b[i]};
   });
   // Search all four sensors IN PARALLEL, reducing dependency on loop sleep.
   for(let iteration=0;iteration<11;iteration++){
     const active=state.some(rule=>rule.hi-rule.lo>1);
     if(!active)break;
     const midReadings={};
     state.forEach(rule=>{
       rule.mid=Math.floor((rule.lo+rule.hi)/2);
       midReadings[rule.sensor]=rule.mid/10;
     });
     const risk=await probe(midReadings);
     state.forEach((rule,i)=>{
       if(rule.hi-rule.lo<=1)return;
       if(risk[i]===rule.start)rule.lo=rule.mid;
       else if(risk[i]===rule.end)rule.hi=rule.mid;
       else throw Error(rule.label+'의 위험 판정은 0 또는 1이어야 합니다.');
     });
   }
   ruleInfo=state.map(rule=>({
     sensor:rule.sensor,label:rule.label,op:rule.op,
     th:(rule.op==='ge'?rule.hi:rule.lo)/10
   }));
   // Verify boundary behavior independently with each sensor toggled while the
   // others remain at their safe side. Detect cross-wired sensor variables.
   const safe={},danger={};
   ruleInfo.forEach(rule=>{
     const t=rule.th,delta=Math.max(.5,Math.abs(t)*.15);
     safe[rule.sensor]=Number((rule.op==='ge'?t-delta:t+delta).toFixed(2));
     danger[rule.sensor]=Number((rule.op==='ge'?t+delta:t-delta).toFixed(2));
   });
   // Realistic nonnegative values only; no artificial negative sensor readings.
   ruleInfo.forEach(rule=>{
     safe[rule.sensor]=Math.max(0,safe[rule.sensor]);
     danger[rule.sensor]=Math.max(0,danger[rule.sensor]);
   });
   const safeBits=await probe(safe),dangerBits=await probe(danger);
   if(safeBits.some(x=>x!==0)||dangerBits.some(x=>x!==1))
     throw Error('센서 위험 판정을 일정한 기준으로 계산하지 못했습니다. 각 센서에 독립적인 비교 조건을 작성해 주세요.');
   // 16 alarm cases. Running EntryJS is NEVER replaced by a hardcoded N rule.
   for(let mask=0;mask<16;mask++){
     const bits=NEPAL_SENSOR_ORDER.map((_,i)=>(mask>>i)&1);
     const synthetic={};ruleInfo.forEach((rule,i)=>synthetic[rule.sensor]=bits[i]?danger[rule.sensor]:safe[rule.sensor]);
     Object.assign(nepalTestValues,synthetic);
     const count=bits.reduce((acc,bit)=>acc+bit,0);
     const stable=await waitForValues(()=>{
       const list=requireList?(readList('위험목록')||[]):[];
       return NEPAL_SENSOR_ORDER.every((key,i)=>numericMatches(readVar(valueVars[i]),synthetic[key])) &&
         (!requireList||(list.length===4&&list.every((v,i)=>numericMatches(v,bits[i])))) &&
         riskVars.every((name,i)=>numericMatches(readVar(name),bits[i])) &&
         numericMatches(readVar('위험개수'),count) &&
         [0,1].includes(Number(readVar('경보결과'))) && readVar('경보결과')!=='';
     },4500);
     if(!stable){
       details.push(`${mask+1}/16: 4개의 위험신호와 위험개수·경보결과가 연동되지 않았습니다.`);
       details.push(requireList?'「위험목록」 리스트 4칸을 최신 위험신호로 갱신하고, 반복문으로 위험개수를 세어 보세요.':'리스트 없이 「수위위험」·「유속위험」·「진동위험」·「강수위험」을 더해 「위험개수」와 경보를 계산해 보세요.');
       return {ok:false,details};
     }
     await wait(120);
     const alarm=Number(readVar('경보결과'));
     observations[mask]=alarm;byCount[count].add(alarm);
   }
 }catch(error){
   return {ok:false,details:['미션 6 코드 검사: '+String(error.message||error)]};
 }finally{await stopCode();resetTestReadings()}
 if(byCount.some(set=>set.size!==1))return {ok:false,details:['같은 위험신호 개수에서는 어떤 센서가 위험하든 경보 결과가 같아야 합니다.']};
 const vals=byCount.map(set=>[...set][0]);
 const n=[1,2,3,4].find(k=>vals.every((v,i)=>v===Number(i>=k)));
 if(!n)return {ok:false,details:['학생 코드가 「4개 센서 중 N개 이상 위험하면 경보」를 구현해야 합니다. N은 1~4입니다.']};
 const rules=Object.fromEntries(ruleInfo.map(({sensor,op,th})=>[sensor,{op,th}]));
 return {ok:true,threshold:n,alarmTable:observations,rules,details:[
   requireList?'리스트·반복문을 활용해 4개 위험신호를 정상 처리했습니다.':'리스트 없이 4개 센서의 위험신호를 종합했습니다.',
   '4개 센서의 임계값과 비교 방향을 학생이 작성한 엔트리 실행 결과에서 판별했습니다.',
   ...ruleInfo.map(rule=>`${rule.label} ${rule.op==='ge'?'이상':'이하'} ${rule.th}`),
   `학생 코드의 경보 기준: ${n}개 이상 · 16가지 위험신호 조합 검증 완료`,
   '이제 원본 재난 시뮬레이션의 100회 평가에 적용합니다.'
 ]};
}
async function check(mission){
 if(!window.__entryReady)throw Error('엔트리 편집기 준비가 아직 끝나지 않았습니다.');
 switch(mission){
 case 0:return checkWaterVariable();
 case 1:return checkContinuousWaterVariable();
 case 2:return checkWaterRisk();
 case 3:return checkOtherRisk();
 case 4:return checkChosenAlarmN(false); // Mission 5: no list, graded
 case 5:return checkChosenAlarmN(true);  // Mission 6: list only, no graded 100-run
 case 6:return checkChosenAlarmN(true);  // FINAL: list + full disaster evaluation
 default:return {ok:false,details:['등록되지 않은 미션입니다.']};
 }
}

  const sources = [
    'https://entry-cdn.pstatic.net/lib/entry-js/images/',
    'https://playentry.org/lib/entry-js/images/',
    'https://cdn.jsdelivr.net/gh/entrylabs/entryjs@develop/images/',
    'https://raw.githubusercontent.com/entrylabs/entryjs/develop/images/'
  ];
  const elementState = new WeakMap();
  const report = {redirected:0, recovered:0, embedded:0, exhausted:[], lastFailures:[]};
  const queued = new Set();
  const isTrustedHost = (host) => [location.hostname,'entry-cdn.pstatic.net','playentry.org',
    'cdn.jsdelivr.net','raw.githubusercontent.com'].includes(host);
  function parseAsset(uri) {
    if (!uri || /^(data:|blob:|javascript:|#)/i.test(uri)) return null;
    let url;try {url=new URL(uri,location.href)}catch(_){return null}
    if (!isTrustedHost(url.hostname)) return null;
    const match=url.pathname.match(/(?:^|\/)images\/([^?#]+\.(?:svg|png|jpg|jpeg|gif|webp))$/i);
    if (!match) return null;
    // Reject project uploads and unrelated CDN imagery.
    if (/\/(?:uploads|projects|thumb|user|api)\//i.test(url.pathname)) return null;
    return match[1];

  }
  function writeAttr(el,attr,url){

    el.setAttribute(attr,url);

    if(!st)return;
    if(st.index >= st.candidates.length){
      if (!st.exhausted){
        st.exhausted=true;
        report.exhausted.push(st.original);
        report.lastFailures.push({original:st.original,filename:st.name});
        if(report.lastFailures.length>12)report.lastFailures.shift();
        updateUI();
      }
      return;
    }
    const next=st.candidates[st.index++];
    st.current=next;
    st.attempted.push(next);
    writeAttr(el,st.attr,next);
    report.redirected++;
    updateUI();

    if(!el || el.nodeType!==1)return;
    const name=el.localName?.toLowerCase();
    if(name!=='img' && name!=='image')return;
    const attr=name==='img'?'src':'href';
    const current=readAttr(el,attr);
    if(!current)return;
    const old=elementState.get(el);

    // Render these six frequently used event icons from the official source bundled with this HTML.
    // This works even when the CDN is blocked and prevents dozens of repeated retries for the same SVG.
    if(nameInImages.startsWith('block_icon/') && embeddedEntryStartIcons[nameInImages.slice('block_icon/'.length)]){

    uiTimer=setTimeout(()=>{

    document.addEventListener('error',event=>{

    return `NEPAL × ENTRY 이미지 진단 v1.2\n내장 아이콘 복구: ${report.embedded}건\nCDN 연결 시도: ${report.redirected}회\n이미지 로드 이벤트: ${report.recovered}회 (SVG 이미지에서는 감지되지 않을 수 있음)\n복구 실패: ${report.exhausted.length}건\n` +
      report.lastFailures.map((o,i)=>`${i+1}. ${o.original} → ${o.filename}`).join('\n') +
      '\n공식 CDN이 차단되었다면 이미지 파일을 저장소에 직접 설치해야 합니다.';
  }
  return {install,report,diagnostic};
})();

const NEPAL_SPRITES = [
 {key:'sensor',label:'센서 관측기'},
 {key:'alarm',label:'경보 장치'},
 {key:'village',label:'대피 마을'},
 {key:'robot',label:'관측 로봇'}
];
let nepalSpriteMode = 'object';
const nepalChooser=document.getElementById('nepalSpriteChooser');
const nepalMsg=document.getElementById('nepalSpriteMessage');
function nepalObjectPicture(name, uri, dims={width:192,height:192}) {
  // EntryJS's Picture schema accepts a concrete fileurl; filename alone would use
  // /uploads at the publisher's web root, inaccessible at /nepal/.
  return {
    id:Entry.generateHash(12), name, label:{ko:name,en:name},
    imageType: uri.startsWith('data:image/jpeg')?'jpg':'png', fileurl:uri,
    dimension:{width:dims.width,height:dims.height}, trimmed:null
  };
}
function nepalAddSprite(name,uri,dims){
 const picture=nepalObjectPicture(name,uri,dims);
 if(nepalSpriteMode==='picture' && typeof Entry.playground?.addPicture==='function'){
   Entry.playground.addPicture(picture,true,true);
 }else{
   if(typeof Entry.container?.addObject!=='function')throw Error('Entry.container.addObject를 찾지 못했습니다.');
   Entry.container.addObject({id:Entry.generateHash(12),name,objectType:'sprite',sprite:{name,pictures:[picture],sounds:[],category:{}}},0);
 }
}
function nepalOpenChooser(mode='object'){
 nepalSpriteMode=mode;
 document.getElementById('nepalSpriteTitle').textContent=mode==='picture'?'모양 추가하기':'오브젝트 추가하기';
 nepalMsg.textContent='';nepalChooser.hidden=false;
 document.getElementById('nepalSpriteClose').focus();
}
function nepalCloseChooser(){nepalChooser.hidden=true;}
function nepalWireObjectEvents(E){
 if(typeof E.addEventListener!=='function'){
   console.warn('[NEPAL] Entry.addEventListener is missing');return;
 }
 E.addEventListener('openSpriteManager',()=>nepalOpenChooser('object'));
 E.addEventListener('openPictureManager',()=>nepalOpenChooser('picture'));
 // The original EntryJS workspace also broadcasts other manager events;
 // we do not impersonate the official cloud catalog. They are outside this lesson.
}
function nepalRepairStarter(E){
 // EntryJS start-project's default EntryBot often points to unreachable /uploads.
 // Give the existing default object a self-contained picture when supported.
 if(Array.isArray(E.container?.objects_) && E.container.objects_.length>0 && typeof E.playground?.addPicture==='function'){
   try{E.playground.addPicture(nepalObjectPicture('관측 로봇',NEPAL_SPRITE_IMAGE.robot),true,true)}
   catch(err){console.warn('[NEPAL] 기본 오브젝트 모양 추가 생략:',err)}
 }
 // Add a real mission sprite through the public Entry.container.addObject API.
 // This remains visible even if the starter EntryBot has a broken asset filename.
 try{nepalAddSprite('센서 관측기',NEPAL_SPRITE_IMAGE.sensor)}
 catch(err){console.warn('[NEPAL] 센서 관측기 추가 실패:',err)}
}
function nepalInitPicker(){
 const grid=document.getElementById('nepalSpriteGrid');
 for(const item of NEPAL_SPRITES){
  const button=document.createElement('button');button.type='button';button.className='npsprite';
  const img=document.createElement('img');img.src=NEPAL_SPRITE_IMAGE[item.key];img.alt='';
  const label=document.createElement('span');label.textContent=item.label;
  button.append(img,label);button.addEventListener('click',()=>{
    try{nepalAddSprite(item.label,NEPAL_SPRITE_IMAGE[item.key]);nepalCloseChooser()}
    catch(err){nepalMsg.textContent='오브젝트 추가 실패: '+String(err?.message||err);console.error(err)}
  });grid.appendChild(button);
 }
 document.getElementById('nepalSpriteClose').addEventListener('click',nepalCloseChooser);
 nepalChooser.addEventListener('click',e=>{if(e.target===nepalChooser)nepalCloseChooser()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!nepalChooser.hidden)nepalCloseChooser()});
 document.getElementById('nepalImageUpload').addEventListener('change',async e=>{
  const file=e.target.files?.[0];if(!file)return;
  if(!['image/png','image/jpeg','image/webp'].includes(file.type)){nepalMsg.textContent='PNG, JPG 또는 WEBP 이미지 파일을 선택하세요.';return;}
  if(file.size>3*1024*1024){nepalMsg.textContent='이미지 크기는 3MB 이하여야 합니다.';return;}
  try{
    const uri=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('파일을 읽을 수 없습니다.'));reader.readAsDataURL(file)});
    const dims=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve({width:img.naturalWidth,height:img.naturalHeight});img.onerror=()=>reject(Error('이미지를 열 수 없습니다.'));img.src=uri});
    nepalAddSprite(file.name.replace(/\.[^.]+$/,''),uri,dims);nepalCloseChooser();
  }catch(err){nepalMsg.textContent='이미지 추가 실패: '+err.message}finally{e.target.value=''}
 });
}
nepalInitPicker();

async function boot(){try{
  primeLocalLibraries();
  for(let i=0;i<deps.length;i++){await loadDependency(deps[i][0],deps[i][1],deps[i][2],i+1,deps.length);}
  if(typeof window.Entry?.init!=='function')throw Error('EntryJS 로딩 후 초기화 함수를 찾지 못했습니다.');
  const E=window.Entry;
  installNepalSensorReporters(E);
  statusEl.textContent='엔트리 실행 환경을 초기화하는 중…';
  if(E.Event)E.creationChangedEvent=new E.Event(window);
  E.init(document.getElementById('workspace'),{
    type:'workspace',libDir:'https://entry-cdn.pstatic.net/lib',entryDir:'/entry-js',defaultDir:'https://playentry.org',soundDir:'https://playentry.org',
    projectsaveable:true,variableEnable:true,listEnable:true,
    hardwareEnable:false,textCodingEnable:false,expansionDisable:true,
    fonts:[{name:'나눔고딕',family:'Nanum Gothic',url:'https://fonts.googleapis.com/earlyaccess/nanumgothic.css'}]
  });
  nepalWireObjectEvents(E);
  try{window.createjs?.Sound?.setMute?.(true)}catch(_){}
  await Promise.resolve(E.loadProject());await wait(750);
  nepalRepairStarter(E);
  removeOldTeacherSeeds(E);
  // Refresh the EntryJS toolbox AFTER loadProject and starter objects have been prepared.
  // The v1.3 version registered the reporters too early; they were absent from '자료'.
  let blockMenuStatus;
  try{blockMenuStatus=refreshNepalBlockMenu(E,'프로젝트 로드 후');}
  catch(menuError){nepalBlockMenuLog.push('자동 메뉴 등록 오류: '+String(menuError));console.error('[NEPAL] 센서 블록 메뉴',menuError)}
  // Do NOT pre-create any student variable: creating all three is the learning task.
  window.__entryReady=true;
  // EntryJS generates category codes asynchronously. Show successful status
  // only if all three sensor labels actually appear in the SVG.
  function verifyReporterRender(){
    const shown=updateNepalBlockStatus(E).visualLabels.length;
    statusEl.textContent=shown===nepalReporterDefs.length
      ? '✅ 엔트리 준비 완료 · 자료 탭 센서 블록 4종 표시'
      : `⚠ 엔트리 준비 완료 · 센서 블록 화면 표시 ${shown}/${nepalReporterDefs.length}`;
  }
  [200,650,1300].forEach(ms=>setTimeout(verifyReporterRender,ms));
  notify('ENTRY_READY');
 }catch(e){console.error('[NEPAL ENTRY v2.5] 부팅 실패',e,executionErrors,bootNotes);fail(e.message||String(e));}}
window.addEventListener('message',e=>{
  if(e.source!==window.parent || e.origin!==location.origin)return;
  if(e.data?.type!=='NEPAL_SENSOR_TELEMETRY')return;
  const sensor=e.data.sensor;
  if(!Object.prototype.hasOwnProperty.call(nepalPrivateTelemetry,sensor))return;
  const v=Number(e.data.value);
  if(Number.isFinite(v) && v>=0 && v<100000){
    // Not stored in Entry.variableContainer: no variable dropdown access.
    nepalPrivateTelemetry[sensor]={value:v,source:String(e.data.source||'센서 측정값')};
    if(sensor==='water'){
      const el=document.getElementById('nepal-sensor-preview');
      if(el)el.textContent='📡 수위 '+v.toFixed(2)+' m · 읽기 전용';
    }
  }
});

// Never keep an EntryJS infinite-repeat script running behind the simulator.
window.addEventListener('message',e=>{
  if(e.source!==window.parent || e.origin!==location.origin)return;
  if(e.data?.type==='NEPAL_DEV_RESUME'){
    nepalDeveloperVisible=true;
  }else if(e.data?.type==='NEPAL_DEV_PAUSE'){
    nepalDeveloperVisible=false;
    if(window.__entryReady && !nepalChecking){
      Promise.resolve(stopCode()).catch(error=>console.warn('엔트리 일시정지:',error));
    }
  }
});
// Navigation from one mission to another must never leave the previous
// mission's infinite-repeat code running. Acknowledge only after a real stop.
window.addEventListener('message',async e=>{
  if(e.source!==window.parent || e.origin!==location.origin)return;
  if(e.data?.type!=='NEPAL_STOP_FOR_MISSION')return;
  const token=e.data.token;
  if(nepalChecking){
    notify('ENTRY_MISSION_STOPPED',{token,ok:false,message:'실행 검사 중에는 미션을 바꿀 수 없습니다.'});
    return;
  }
  try{
    await stopCode();
    resetTestReadings();
    const engine=window.Entry?.engine;
    if(engine && engine.state!=='stop')throw Error('엔트리 실행 엔진이 아직 정지 상태가 아닙니다.');
    notify('ENTRY_MISSION_STOPPED',{token,ok:true});
  }catch(error){
    notify('ENTRY_MISSION_STOPPED',{token,ok:false,message:String(error.message||error)});
  }
});
// Read-only comparison of the student variable and the privately measured value.
let nepalDeveloperVisible=false;
setInterval(()=>{
 if(!window.__entryReady || !nepalDeveloperVisible || nepalChecking)return;
 const actual=readVar('수위값');
 notify('ENTRY_VAR_SNAPSHOT',{
   value:actual===null||actual===''?null:Number(actual),
   variables:{water:readVar('수위값'),flow:readVar('유속값'),vibration:readVar('진동값'),rain:readVar('강수값')},
   risks:{water:readVar('수위위험'),flow:readVar('유속위험'),vibration:readVar('진동위험'),rain:readVar('강수위험')},
   dangerCount:readVar('위험개수'),alarm:readVar('경보결과'),
   list:readList('위험목록'),
   running:nepalIsRunning()
 });
},700);
// Export/import the complete EntryJS workspace for group-level auto backup.
// Do not create a new project or clear students' blocks while exporting.
window.addEventListener('message',async e=>{
 if(e.source!==window.parent || e.origin!==location.origin)return;
 const message=e.data||{};
 if(message.type==='NEPAL_EXPORT_PROJECT'){
  try{
   if(!window.__entryReady || nepalChecking)throw Error('검사 중이거나 엔트리 준비 전입니다.');
   const project=await Promise.resolve(window.Entry.exportProject());
   if(!project || !Array.isArray(project.objects))throw Error('유효한 엔트리 프로젝트가 아닙니다.');
   const safe=JSON.parse(JSON.stringify(project));
   notify('ENTRY_PROJECT_EXPORTED',{token:message.token,project:safe});
  }catch(error){notify('ENTRY_PROJECT_EXPORT_ERROR',{token:message.token,message:String(error.message||error)});}
 }
 if(message.type==='NEPAL_IMPORT_PROJECT'){
  try{
   if(!window.__entryReady || nepalChecking)throw Error('검사 중이거나 엔트리 준비 전입니다.');
   const project=message.project;
   if(!project || !Array.isArray(project.objects))throw Error('저장된 프로젝트 데이터가 잘못되었습니다.');
   await stopCode();
   await Promise.resolve(window.Entry.loadProject(project));
   // EntryJS constructs its toolbox asynchronously. Reinstall our custom
   // read-only live sensors without resetting the restored student code.
   installNepalSensorReporters(window.Entry);
   await wait(500);
   refreshNepalBlockMenu(window.Entry,'저장된 학급 프로젝트 복원 후');
   notify('ENTRY_PROJECT_IMPORTED',{token:message.token,ok:true});
  }catch(error){notify('ENTRY_PROJECT_IMPORTED',{token:message.token,ok:false,message:String(error.message||error)});}
 }
});
window.addEventListener('message',async e=>{
 if(e.source!==window.parent || e.origin!==location.origin)return;
 if(e.data?.type!=='NEPAL_TEST')return;
 if(nepalChecking){notify('ENTRY_CHECK_RESULT',{ok:false,details:['이미 검사가 실행 중입니다. 잠시 기다려 주세요.']});return;}
 nepalChecking=true;
 try{const result=await check(Number(e.data.mission));notify('ENTRY_CHECK_RESULT',result)}
 catch(error){notify('ENTRY_CHECK_RESULT',{ok:false,details:['엔트리 실행 또는 검사 오류: '+String(error.message||error),'브라우저 개발자 도구 콘솔을 확인해 주세요.']})}
 finally{
  nepalChecking=false;
  if(!nepalDeveloperVisible && window.__entryReady){
    try{await stopCode()}catch(err){console.warn('숨김 상태 엔트리 정지',err)}
  }
 }
});
document.getElementById('assets-status').addEventListener('click',()=>{document.getElementById('assets-report-text').textContent=NEPAL_ASSET_RESCUE.diagnostic();document.getElementById('assets-report').style.display='block';});
document.getElementById('assets-status').addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click();}});
document.getElementById('close-assets').addEventListener('click',()=>{document.getElementById('assets-report').style.display='none'});
document.getElementById('copy-assets').addEventListener('click',()=>{navigator.clipboard.writeText(NEPAL_ASSET_RESCUE.diagnostic()).then(()=>{document.getElementById('copy-assets').textContent='복사 완료'})});
NEPAL_ASSET_RESCUE.install();
boot();
</script></body></html>
