    const candidates=[...new Set(sources.map(prefix=>prefix+nameInImages))];
    // Try to preserve a currently valid remote URL, and only reroute when it fails.
    const exact=candidates.findIndex(u=>u===new URL(current,location.href).href);
    const state={attr,original:current,name:nameInImages,index:0,candidates,attempted:[],current,exhausted:false};
    elementState.set(el,state);
    if(exact>=0){state.index=exact+1;state.attempted.push(current);}
    else tryNext(el);
    if(name==='img'){
      // Already loaded images should not be modified further.
      if(el.complete && el.naturalWidth>0)report.recovered++;
    }
  }
  function scan(node){
    if(!node || node.nodeType!==1)return;
    hookElement(node);
    node.querySelectorAll?.('img,svg image').forEach(hookElement);
  }
  let uiTimer=0;
  function updateUI(){
    clearTimeout(uiTimer);
    uiTimer=setTimeout(()=>{
      const label=document.getElementById('assets-status');
      if(label){
        label.textContent=report.exhausted.length?`이미지 일부 복구 실패 ${report.exhausted.length}개 · 상세 확인`:
          report.redirected?`이미지 리소스 자동 연결 중 · ${report.redirected}회 시도`:'이미지 리소스 경로 확인 중';
        label.style.color=report.exhausted.length?'#a33926':'#396b32';
      }
    },160);
  }
  function install(){
    // In capture phase, broken image events are available even when they do not bubble.
    document.addEventListener('error',event=>{
      const el=event.target;
      if(!elementState.has(el))hookElement(el);
      if(elementState.has(el))tryNext(el);
    },true);
    document.addEventListener('load',event=>{
      const st=elementState.get(event.target);
      if(st){report.recovered++;updateUI();}
    },true);
    const observer=new MutationObserver(records=>{
      for(const r of records){
        if(r.type==='attributes')hookElement(r.target);
        else for(const n of r.addedNodes)scan(n);
      }
    });
    observer.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src','href','xlink:href']});
    scan(document.body);
    updateUI();
  }
  function diagnostic(){
    return `NEPAL × ENTRY 이미지 진단 v0.9\n자동 연결 시도: ${report.redirected}회\n로딩 완료: ${report.recovered}회\n복구 실패: ${report.exhausted.length}건\n` +
      report.lastFailures.map((o,i)=>`${i+1}. ${o.original} → ${o.filename}`).join('\n') +
      '\n공식 CDN이 차단되었다면 이미지 파일을 저장소에 직접 설치해야 합니다.';
  }
  return {install,report,diagnostic};
})();

async function boot(){try{
  for(let i=0;i<deps.length;i++){await loadDependency(deps[i][0],deps[i][1],deps[i][2],i+1,deps.length);}
  if(typeof window.Entry?.init!=='function')throw Error('EntryJS 로딩 후 초기화 함수를 찾지 못했습니다.');
  const E=window.Entry;
  statusEl.textContent='엔트리 실행 환경을 초기화하는 중…';
  if(E.Event)E.creationChangedEvent=new E.Event(window);
  E.init(document.getElementById('workspace'),{
    type:'workspace',libDir:'https://entry-cdn.pstatic.net/lib',entryDir:'https://entry-cdn.pstatic.net/lib/entry-js',
    projectsaveable:true,variableEnable:true,listEnable:true,
    hardwareEnable:false,textCodingEnable:false,expansionDisable:true,
    fonts:[{name:'나눔고딕',family:'Nanum Gothic',url:'https://fonts.googleapis.com/earlyaccess/nanumgothic.css'}]
  });
  await Promise.resolve(E.loadProject());await wait(750);
  // Teacher-provided measurement inputs. Student-created solution variables are NOT precreated.
  const seed=teacherVariables.filter(([,name])=>!getVar(name)).map(([id,name,value])=>({id,name,value,variableType:'variable',visible:true,object:null}));
  if(seed.length)E.variableContainer.appendVariables(seed);
  window.__entryReady=true;statusEl.textContent='✅ 실제 엔트리 편집기 준비 완료';notify('ENTRY_READY');
 }catch(e){console.error('[NEPAL ENTRY v0.9] 부팅 실패',e,executionErrors,bootNotes);fail(e.message||String(e));}}
window.addEventListener('message',async e=>{
 if(e.source!==window.parent || e.origin!==location.origin)return;
 if(e.data?.type!=='NEPAL_TEST')return;
 try{const result=await check(Number(e.data.mission));notify('ENTRY_CHECK_RESULT',result)}
 catch(error){notify('ENTRY_CHECK_RESULT',{ok:false,details:['엔트리 실행 또는 검사 오류: '+String(error.message||error),'브라우저 개발자 도구 콘솔을 확인해 주세요.']})}
});
document.getElementById('assets-status').addEventListener('click',()=>{document.getElementById('assets-report-text').textContent=NEPAL_ASSET_RESCUE.diagnostic();document.getElementById('assets-report').style.display='block';});
document.getElementById('assets-status').addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click();}});
document.getElementById('close-assets').addEventListener('click',()=>{document.getElementById('assets-report').style.display='none'});
document.getElementById('copy-assets').addEventListener('click',()=>{navigator.clipboard.writeText(NEPAL_ASSET_RESCUE.diagnostic()).then(()=>{document.getElementById('copy-assets').textContent='복사 완료'})});
NEPAL_ASSET_RESCUE.install();
boot();
</script></body></html>
